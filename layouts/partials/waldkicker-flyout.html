<!-- Waldkicker Flyout Banner -->
<div id="waldkicker-flyout" class="fixed bottom-4 right-4 z-50 transform translate-y-full opacity-0 transition-all duration-500 ease-out max-w-sm">
  <div class="bg-gradient-to-r from-[#2d5016] to-[#4a7c23] rounded-xl shadow-2xl overflow-hidden border-2 border-[#7cb342]">
    <!-- Close button -->
    <button
      id="waldkicker-close"
      class="absolute top-2 right-2 w-6 h-6 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 transition-colors text-white"
      aria-label="Schließen"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <a href="/waldkicker/" class="block p-4 hover:bg-white/5 transition-colors">
      <div class="flex items-center gap-4">
        <!-- Waldkicker Logo -->
        <div class="flex-shrink-0 bg-white rounded-lg p-2">
          <img
            src="/images/waldkicker-logo.svg"
            alt="Waldkicker Logo"
            class="w-16 h-16 object-contain"
          >
        </div>

        <!-- Text Content -->
        <div class="flex-1 min-w-0">
          <p class="text-white/80 text-sm font-medium mb-1">Hey, kennst du schon</p>
          <p class="text-white text-lg font-bold leading-tight">unsere Waldkicker?</p>
          <p class="text-[#a5d66a] text-xs mt-1 flex items-center gap-1">
            Mehr erfahren
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </p>
        </div>
      </div>
    </a>
  </div>
</div>

<script>
(function() {
  const flyout = document.getElementById('waldkicker-flyout');
  const closeBtn = document.getElementById('waldkicker-close');
  const storageKey = 'waldkicker-flyout-dismissed';

  // Check if user has dismissed the flyout
  if (localStorage.getItem(storageKey)) {
    flyout.remove();
    return;
  }

  // Show flyout after a short delay
  setTimeout(() => {
    flyout.classList.remove('translate-y-full', 'opacity-0');
    flyout.classList.add('translate-y-0', 'opacity-100');
  }, 1500);

  // Close button handler
  closeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    flyout.classList.add('translate-y-full', 'opacity-0');
    localStorage.setItem(storageKey, 'true');
    setTimeout(() => flyout.remove(), 500);
  });
})();
</script>
