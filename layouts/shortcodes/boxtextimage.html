<div class="jsg-media{{ if eq (.Get "position") "right" }} jsg-media--reverse{{ end }} my-12">
  <div class="jsg-media__body">
    {{ with .Get "title" }}
    <h3 class="jsg-media__title">{{ . }}</h3>
    {{ end }}
    <div class="text-gray-700 leading-relaxed">
      {{ .Inner | markdownify }}
    </div>
    {{ with .Get "link" }}
    <p class="mt-4"><a href="{{ . }}"
        class="text-accent-blue hover:text-accent-hover-blue font-semibold transition-colors">Mehr erfahren →</a></p>
    {{ end }}
  </div>

  <div class="jsg-media__figure">
    {{ with .Get "image" }}
    <img src="{{ . }}" alt="{{ $.Get "title" }}" class="jsg-media__image">
    {{ else }}
    <!-- Platzhalterbild -->
    <div class="w-full bg-gray-100 p-8 text-center text-gray-500 rounded-lg">Bild folgt</div>
    {{ end }}
  </div>
</div>
